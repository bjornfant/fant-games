<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Biljard – Spelhörnan</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="btn" href="../index.html">← Spelhörnan</a>
      <h1 class="game-title">Biljard</h1>
      <button class="btn blue" data-mute type="button">🔊 Ljud på</button>
    </header>

    <main class="game-layout" style="--stage-w: 800px">
      <div class="players">
        <div class="player" id="p0"><div class="pname" id="n0">Du</div><div class="minis" id="g0"></div></div>
        <div class="player" id="p1"><div class="pname" id="n1">Boten</div><div class="minis" id="g1"></div></div>
      </div>
      <div class="status" id="status">&nbsp;</div>

      <div class="stage">
        <canvas id="board" width="800" height="450"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="ovTitle">Biljard</h2>
          <p id="ovText">Åttabollsbiljard mot en bot. Potta alla dina bollar (hela eller halva) och därefter åttan. Välj svårighetsgrad:</p>
          <div class="levels">
            <button class="btn green" data-level="easy" type="button">Lätt</button>
            <button class="btn" data-level="medium" type="button">Medel</button>
            <button class="btn pink" data-level="hard" type="button">Svår</button>
          </div>
          <p id="ovWins" class="small"></p>
        </div>
      </div>

      <div class="controls">
        <label for="power">Kraft</label>
        <input type="range" id="power" min="5" max="100" value="60">
        <button class="btn pink" id="shoot" type="button">Skjut</button>
        <button class="btn" id="newMatch" type="button">Ny match</button>
      </div>

      <p class="hint">Sikta med musen eller fingret · Klicka (mus) eller Skjut-knappen · ←/→ finjusterar, ↑/↓ kraft, mellanslag skjuter</p>
    </main>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/billiard-engine.js"></script>
  <script src="../js/billiard.js"></script>
</body>
</html>
